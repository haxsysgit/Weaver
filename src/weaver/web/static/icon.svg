<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Weaver mark: a spider-web / fate-strings motif with the crimson eye.
       Dark-fantasy mask silhouette, threads of fate converging. -->
  <rect width="64" height="64" rx="14" fill="#0c0c11"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#b0342a" stroke-width="1.6" opacity="0.55"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#b0342a" stroke-width="1.2" opacity="0.4"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#b0342a" stroke-width="1" opacity="0.3"/>
  <!-- fate strings -->
  <line x1="6" y1="10" x2="58" y2="54" stroke="#a8a8b8" stroke-width="0.8" opacity="0.35"/>
  <line x1="58" y1="10" x2="6" y2="54" stroke="#a8a8b8" stroke-width="0.8" opacity="0.35"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#a8a8b8" stroke-width="0.6" opacity="0.25"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#a8a8b8" stroke-width="0.6" opacity="0.25"/>
  <!-- the eye -->
  <ellipse cx="32" cy="32" rx="4.2" ry="6.5" fill="#b0342a"/>
  <ellipse cx="32" cy="32" rx="1.8" ry="2.8" fill="#07070a"/>
</svg>
