# Weaver container on a private host. The EC2 and Tailscale Funnel v1 deploy
# path is retired; the public surface moves to Cloudflare in Plan 030 CP7.
# The bundle (novels/, .weaver/) lives on the host volume, not in the image.
services:
  weaver:
    image: ghcr.io/haxsysgit/weaver:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WEAVER_PROJECT_ROOT: /srv/weaver
      WEAVER_ALLOWED_HOSTS: ${WEAVER_ALLOWED_HOSTS:?set the public hostname}
      WEAVER_DENSE_ONNX: /srv/weaver/.weaver/models/int8/model_quantized.onnx
      DEEPSEEK_KEY: ${DEEPSEEK_KEY:?set DEEPSEEK_KEY in .env on the box}
      WEAVER_SPONSORED_ENABLED: ${WEAVER_SPONSORED_ENABLED:-0}
      WEAVER_SPONSORED_PASS_SECRET: ${WEAVER_SPONSORED_PASS_SECRET:-}
      WEAVER_SPONSORED_PRICE_VALID_UNTIL: ${WEAVER_SPONSORED_PRICE_VALID_UNTIL:-2026-12-31T00:00:00+00:00}
      WEAVER_TRUSTED_PROXY_ADDRESSES: ${WEAVER_TRUSTED_PROXY_ADDRESSES:-}
      WEAVER_ORIGINAL_ADDRESS_HEADER: ${WEAVER_ORIGINAL_ADDRESS_HEADER:-}
    volumes:
      - /srv/weaver:/srv/weaver
