[project]
name = "novelfriend"
version = "0.1.0"
description = "Trustworthy experiments for building Weaver, a synthetic lifelong reader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "firecrawl-py>=4.33.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.1",
    "openai>=2.11.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "tiktoken>=0.13.0",
]

[project.scripts]
weaver = "weaver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weaver"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
