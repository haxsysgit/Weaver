[project]
name = "weaver"
dynamic = ["version"]
description = "A reading companion for Shadow Slave: the agent of the nightmare spell that reads every chapter and answers with the chapter in hand."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "fastembed>=0.8",
    "firecrawl-py>=4.33.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.1",
    "openai>=2.11.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.19",
    "tiktoken>=0.13.0",
    "uvicorn>=0.30",
]

[project.scripts]
weaver = "weaver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version lives in src/weaver/__init__.py (__version__); hatchling reads
# it at build time. Path-based (not git-tag-based) because the Docker
# image build copies only pyproject + src, no .git, so git-sourced
# versioning would break `pip install .` inside the image.
path = "src/weaver/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/weaver"]
artifacts = ["src/weaver/web/dist"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
