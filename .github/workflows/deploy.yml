name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/haxsysgit/weaver:latest

      - name: Deploy to box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEAVER_BOX }}
          username: ubuntu
          key: ${{ secrets.WEAVER_BOX_DEPLOY_KEY }}
          script: |
            cd /srv/weaver
            docker compose pull
            docker compose up -d
            docker image prune -f
