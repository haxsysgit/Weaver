<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
  <title id="title">Plan 003 Weaver model layer architecture</title>
  <desc id="description">Provider-independent model requests flow through ModelLayer to fake, DeepSeek, or future adapters. Final responses return to the agent, which applies stop rules and dispatches safe tool calls through an active tool boundary.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4F81BD" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8064A2" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C97A24" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4D8C57" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C94F45" />
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .lane-title { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .node-copy { font-size: 12px; text-anchor: middle; fill: #394554; }
      .edge-label { font-size: 11px; font-weight: 600; }
      .edge { fill: none; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#FFFFFF" />
  <text x="40" y="48" font-size="26" font-weight="700">Plan 003: one Weaver model protocol, provider adapters translate</text>
  <text x="40" y="78" font-size="15" fill="#52606D">The agent owns messages, tool safety, and terminal behaviour. Providers own wire formats.</text>

  <g>
    <rect x="40" y="110" width="290" height="810" rx="14" fill="#F8FBFE" stroke="#4F81BD" stroke-width="2" />
    <path d="M40 148 H330" stroke="#4F81BD" stroke-width="2" />
    <rect x="40" y="110" width="290" height="38" rx="14" fill="#E8F3FC" />
    <text x="60" y="135" class="lane-title" fill="#24476B">Agent runtime</text>
  </g>
  <g>
    <rect x="360" y="110" width="610" height="810" rx="14" fill="#FCF9FF" stroke="#8064A2" stroke-width="2" />
    <path d="M360 148 H970" stroke="#8064A2" stroke-width="2" />
    <rect x="360" y="110" width="610" height="38" rx="14" fill="#F0E8FA" />
    <text x="380" y="135" class="lane-title" fill="#4C3868">Weaver model layer</text>
  </g>
  <g>
    <rect x="1000" y="110" width="290" height="810" rx="14" fill="#FFFDFC" stroke="#C97A24" stroke-width="2" />
    <path d="M1000 148 H1290" stroke="#C97A24" stroke-width="2" />
    <rect x="1000" y="110" width="290" height="38" rx="14" fill="#FCEBD9" />
    <text x="1020" y="135" class="lane-title" fill="#754512">Provider adapters</text>
  </g>
  <g>
    <rect x="1320" y="110" width="440" height="810" rx="14" fill="#FAFDFA" stroke="#4D8C57" stroke-width="2" />
    <path d="M1320 148 H1760" stroke="#4D8C57" stroke-width="2" />
    <rect x="1320" y="110" width="440" height="38" rx="14" fill="#E7F4EA" />
    <text x="1340" y="135" class="lane-title" fill="#285A31">Tool boundary</text>
  </g>

  <g>
    <rect x="75" y="180" width="220" height="70" rx="12" fill="#D9EAF7" stroke="#4F81BD" stroke-width="2" />
    <text x="185" y="207" class="node-title">CLI or caller</text>
    <text x="185" y="229" class="node-copy">selects ModelSpec</text>
  </g>
  <g>
    <rect x="75" y="300" width="220" height="78" rx="12" fill="#D9EAF7" stroke="#4F81BD" stroke-width="2" />
    <text x="185" y="329" class="node-title">AgentSession</text>
    <text x="185" y="352" class="node-copy">history + active tools</text>
  </g>
  <g>
    <rect x="75" y="430" width="220" height="82" rx="12" fill="#D9EAF7" stroke="#4F81BD" stroke-width="2" />
    <text x="185" y="458" class="node-title">project_messages()</text>
    <text x="185" y="481" class="node-copy">canonical history → ModelMessage</text>
  </g>
  <g>
    <path d="M75 650 Q75 630 95 630 H275 Q295 630 295 650 V735 Q295 755 275 755 H95 Q75 755 75 735 Z" fill="#D9EAF7" stroke="#4F81BD" stroke-width="2" />
    <ellipse cx="185" cy="650" rx="110" ry="20" fill="#EAF3FA" stroke="#4F81BD" stroke-width="2" />
    <text x="185" y="681" class="node-title">Durable conversation</text>
    <text x="185" y="705" class="node-copy">one grouped assistant message</text>
    <text x="185" y="726" class="node-copy">+ linked tool results</text>
  </g>
  <g>
    <rect x="75" y="800" width="220" height="82" rx="12" fill="#EAF2F8" stroke="#4F81BD" stroke-width="2" />
    <text x="185" y="827" class="node-title">TurnResult</text>
    <text x="185" y="849" class="node-copy">COMPLETED | INCOMPLETE</text>
    <text x="185" y="869" class="node-copy">MODEL_FAILED | INTERRUPTED</text>
  </g>

  <g>
    <rect x="400" y="180" width="230" height="92" rx="12" fill="#E6D9F2" stroke="#8064A2" stroke-width="2" />
    <text x="515" y="206" class="node-title">ModelSpec</text>
    <text x="515" y="229" class="node-copy">provider ID + exact model ID</text>
    <text x="515" y="250" class="node-copy">API family + output default</text>
  </g>
  <g>
    <rect x="690" y="180" width="240" height="110" rx="12" fill="#E6D9F2" stroke="#8064A2" stroke-width="2" />
    <text x="810" y="205" class="node-title">ModelRequest</text>
    <text x="810" y="228" class="node-copy">messages + tool schemas</text>
    <text x="810" y="249" class="node-copy">format + optional token override</text>
    <text x="810" y="270" class="node-copy">no provider selection</text>
  </g>
  <g>
    <rect x="505" y="360" width="320" height="120" rx="14" fill="#D5C2E8" stroke="#6B4C8A" stroke-width="3" />
    <text x="665" y="390" class="node-title" font-size="16">ModelLayer</text>
    <text x="665" y="416" class="node-copy">register providers + resolve exact pair</text>
    <text x="665" y="439" class="node-copy">stream() / complete()</text>
    <text x="665" y="460" class="node-copy">exact model default unless overridden</text>
  </g>
  <g>
    <rect x="495" y="545" width="340" height="118" rx="12" fill="#E6D9F2" stroke="#8064A2" stroke-width="2" />
    <text x="665" y="572" class="node-title">Authoritative ModelResponse</text>
    <text x="665" y="596" class="node-copy">one assistant message</text>
    <text x="665" y="617" class="node-copy">normalized + raw stop reason</text>
    <text x="665" y="638" class="node-copy">usage + safe error category</text>
  </g>
  <g>
    <polygon points="665,710 770,770 665,830 560,770" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" />
    <text x="665" y="766" class="node-title">Stop reason?</text>
    <text x="665" y="789" class="node-copy">stop | tool_use | length</text>
    <text x="665" y="809" class="node-copy">error | aborted</text>
  </g>

  <g>
    <rect x="1035" y="180" width="220" height="88" rx="12" fill="#F8D9B8" stroke="#C97A24" stroke-width="2" />
    <text x="1145" y="208" class="node-title">ModelProvider protocol</text>
    <text x="1145" y="232" class="node-copy">translate wire format</text>
    <text x="1145" y="251" class="node-copy">assemble final response</text>
  </g>
  <g>
    <rect x="1035" y="330" width="220" height="95" rx="12" fill="#FFF1E3" stroke="#C97A24" stroke-width="2" />
    <text x="1145" y="357" class="node-title">Fake provider</text>
    <text x="1145" y="380" class="node-copy">deterministic + offline</text>
    <text x="1145" y="401" class="node-copy">stands in for registered providers</text>
  </g>
  <g>
    <rect x="1035" y="490" width="220" height="108" rx="12" fill="#FFF1E3" stroke="#C97A24" stroke-width="2" />
    <text x="1145" y="517" class="node-title">DeepSeek adapter</text>
    <text x="1145" y="540" class="node-copy">only admitted live provider</text>
    <text x="1145" y="561" class="node-copy">payload + stop mapping</text>
    <text x="1145" y="582" class="node-copy">reasoning stays ephemeral</text>
  </g>
  <g>
    <rect x="1035" y="680" width="220" height="92" rx="12" fill="#F7F7F7" stroke="#777777" stroke-width="2" stroke-dasharray="7 5" />
    <text x="1145" y="707" class="node-title" fill="#555555">Future adapter</text>
    <text x="1145" y="730" class="node-copy">GPT | Claude | Grok | local</text>
    <text x="1145" y="751" class="node-copy">deferred, same protocol</text>
  </g>

  <g>
    <rect x="1350" y="180" width="180" height="78" rx="12" fill="#DCEFE0" stroke="#4D8C57" stroke-width="2" />
    <text x="1440" y="207" class="node-title">Active tool schemas</text>
    <text x="1440" y="231" class="node-copy">only advertised names</text>
  </g>
  <g>
    <rect x="1555" y="290" width="175" height="125" rx="12" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" />
    <text x="1642" y="316" class="node-title">Validate final batch</text>
    <text x="1642" y="339" class="node-copy">unique IDs across history</text>
    <text x="1642" y="360" class="node-copy">non-empty names</text>
    <text x="1642" y="381" class="node-copy">exact JSON text</text>
    <text x="1642" y="402" class="node-copy">never silently repaired</text>
  </g>
  <g>
    <rect x="1350" y="455" width="180" height="85" rx="12" fill="#DCEFE0" stroke="#4D8C57" stroke-width="2" />
    <text x="1440" y="483" class="node-title">Persist assistant</text>
    <text x="1440" y="507" class="node-copy">group all calls first</text>
    <text x="1440" y="527" class="node-copy">then execution evidence</text>
  </g>
  <g>
    <rect x="1555" y="575" width="175" height="142" rx="12" fill="#CBE5D1" stroke="#3D7848" stroke-width="3" />
    <text x="1642" y="602" class="node-title">ToolRegistry.dispatch()</text>
    <text x="1642" y="626" class="node-copy">1 registered?</text>
    <text x="1642" y="647" class="node-copy">2 active?</text>
    <text x="1642" y="668" class="node-copy">3 valid JSON?</text>
    <text x="1642" y="689" class="node-copy">4 object?  5 run</text>
  </g>
  <g>
    <rect x="1350" y="775" width="180" height="95" rx="12" fill="#DCEFE0" stroke="#4D8C57" stroke-width="2" />
    <text x="1440" y="802" class="node-title">ToolResultMessage</text>
    <text x="1440" y="826" class="node-copy">same call ID</text>
    <text x="1440" y="847" class="node-copy">non-None success, including {}</text>
  </g>
  <g>
    <rect x="1555" y="775" width="175" height="95" rx="12" fill="#FCE8E6" stroke="#C94F45" stroke-width="2" />
    <text x="1642" y="800" class="node-title" fill="#7A241E">Safety rule</text>
    <text x="1642" y="823" class="node-copy">unsafe, unknown, or inactive</text>
    <text x="1642" y="844" class="node-copy">calls start no handler</text>
  </g>

  <path d="M185 250 V300" class="edge" stroke="#4F81BD" marker-end="url(#arrow-blue)" />
  <path d="M185 378 V430" class="edge" stroke="#4F81BD" marker-end="url(#arrow-blue)" />
  <path d="M295 210 H400" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <text x="326" y="201" class="edge-label" fill="#4C3868">selected</text>
  <path d="M295 471 H340 V315 H810 V290" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <path d="M515 272 V330 H590 V360" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <path d="M810 290 V330 H740 V360" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <path d="M825 420 H975 V224 H1035" class="edge" stroke="#C97A24" marker-end="url(#arrow-orange)" />
  <text x="917" y="409" class="edge-label" fill="#754512">one protocol</text>
  <path d="M1145 268 V330" class="edge" stroke="#C97A24" marker-end="url(#arrow-orange)" />
  <path d="M1255 224 H1275 V544 H1255" class="edge" stroke="#C97A24" marker-end="url(#arrow-orange)" />
  <path d="M1255 224 H1275 V635 H1255 V726" class="edge" stroke="#777777" stroke-dasharray="7 5" marker-end="url(#arrow-orange)" />
  <path d="M1035 224 H990 V604 H835" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <text x="850" y="593" class="edge-label" fill="#4C3868">final response only</text>
  <path d="M665 663 V710" class="edge" stroke="#8064A2" marker-end="url(#arrow-purple)" />
  <path d="M560 770 H320 V692 H295" class="edge" stroke="#4F81BD" marker-end="url(#arrow-blue)" />
  <text x="396" y="760" class="edge-label" fill="#24476B">stop</text>
  <path d="M610 818 H330 V841 H295" class="edge" stroke="#C94F45" marker-end="url(#arrow-red)" />
  <text x="360" y="830" class="edge-label" fill="#7A241E">length | error | aborted</text>
  <path d="M770 770 H990 V280 H1540 V353 H1555" class="edge" stroke="#D6B656" marker-end="url(#arrow-green)" />
  <text x="1455" y="270" class="edge-label" fill="#5D4A00">tool_use</text>
  <path d="M1350 219 H1310 V165 H810 V180" class="edge" stroke="#4D8C57" marker-end="url(#arrow-green)" />
  <text x="1100" y="157" class="edge-label" fill="#285A31">active schemas</text>
  <path d="M1555 397 H1535 V498 H1530" class="edge" stroke="#4D8C57" marker-end="url(#arrow-green)" />
  <path d="M1440 540 V555 H1642 V575" class="edge" stroke="#4D8C57" marker-end="url(#arrow-green)" />
  <path d="M1642 717 V743 H1440 V775" class="edge" stroke="#4D8C57" marker-end="url(#arrow-green)" />
  <path d="M1440 870 V900 H310 V471 H295" class="edge" stroke="#4D8C57" marker-end="url(#arrow-green)" />
  <text x="790" y="891" class="edge-label" fill="#285A31">same call ID, next model request</text>
  <path d="M1350 498 H1310 V675 H320 V690 H295" class="edge" stroke="#4F81BD" marker-end="url(#arrow-blue)" />
  <text x="765" y="665" class="edge-label" fill="#24476B">grouped assistant + execution evidence</text>
  <path d="M1642 415 H1740 V822 H1730" class="edge" stroke="#C94F45" stroke-dasharray="7 5" marker-end="url(#arrow-red)" />
  <text x="1700" y="535" class="edge-label" fill="#7A241E">reject</text>
</svg>
