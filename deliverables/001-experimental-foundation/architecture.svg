<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#526071"/>
    </marker>
    <style>
      .title { font-family: DejaVu-Sans; font-size: 26px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: DejaVu-Sans; font-size: 14px; fill: #526071; }
      .label { font-family: DejaVu-Sans; font-size: 17px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .small { font-family: DejaVu-Sans; font-size: 12px; fill: #526071; text-anchor: middle; }
      .white { fill: #fff; }
      .edge { stroke: #526071; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: DejaVu-Sans; font-size: 12px; fill: #526071; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="50" y="58" class="title">Weaver Plan 001 · Experimental Foundation</text>
  <text x="50" y="88" class="subtitle">Synthetic requests only · no novel content · explicit fake/live boundary</text>

  <rect x="50" y="160" width="185" height="100" rx="16" fill="#E8F0FF" stroke="#4F73D9" stroke-width="2"/>
  <text x="142.5" y="202" class="label">CLI</text>
  <text x="142.5" y="226" class="small">doctor · --fake · --live</text>

  <rect x="295" y="160" width="195" height="100" rx="16" fill="#EAF8F2" stroke="#2C9B70" stroke-width="2"/>
  <text x="392.5" y="202" class="label">Experiment runner</text>
  <text x="392.5" y="226" class="small">model-smoke v1</text>

  <rect x="550" y="160" width="190" height="100" rx="16" fill="#FFF5DB" stroke="#D79B28" stroke-width="2"/>
  <text x="645" y="202" class="label">ModelClient</text>
  <text x="645" y="226" class="small">complete(request)</text>

  <rect x="800" y="120" width="230" height="100" rx="16" fill="#F2EAFE" stroke="#8056C7" stroke-width="2"/>
  <text x="915" y="162" class="label">DeepSeek adapter</text>
  <text x="915" y="186" class="small">AsyncOpenAI · timeout · retries=0</text>

  <rect x="800" y="260" width="230" height="90" rx="16" fill="#F3F5F7" stroke="#738091" stroke-width="2"/>
  <text x="915" y="299" class="label">Deterministic fake</text>
  <text x="915" y="323" class="small">network-free</text>

  <rect x="1045" y="120" width="155" height="100" rx="16" fill="#172033" stroke="#172033" stroke-width="2"/>
  <text x="1122.5" y="162" font-family="DejaVu-Sans" font-size="16px" font-weight="700" fill="#ffffff" text-anchor="middle">DeepSeek API</text>
  <text x="1122.5" y="186" font-family="DejaVu-Sans" font-size="12px" fill="#ffffff" text-anchor="middle">v4-flash · v4-pro</text>

  <rect x="295" y="380" width="445" height="130" rx="16" fill="#FFF0F0" stroke="#C84D5A" stroke-width="2"/>
  <text x="517.5" y="418" class="label">Private receipts</text>
  <text x="517.5" y="444" class="small">.weaver/runs · ignored · owner-only</text>
  <text x="517.5" y="468" class="small">manifest · events · request · response · review</text>

  <rect x="800" y="400" width="350" height="110" rx="16" fill="#F8F9FB" stroke="#A7B0BE" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="975" y="436" class="label">Receipt guardrails</text>
  <text x="975" y="462" class="small">API keys redacted · reasoning text dropped</text>
  <text x="975" y="484" class="small">safe error categories · exact tool arguments</text>

  <path d="M235 210 H287" class="edge"/>
  <path d="M490 210 H542" class="edge"/>
  <path d="M740 190 H790 V170 H792" class="edge"/>
  <text x="770" y="176" class="edge-label">live</text>
  <path d="M740 230 H770 V305 H792" class="edge"/>
  <text x="765" y="286" class="edge-label">fake</text>
  <path d="M1030 170 H1037" class="edge"/>
  <path d="M392 260 V370" class="edge"/>
