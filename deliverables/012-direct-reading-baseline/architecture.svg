    <text x="700" y="174" text-anchor="middle" font-size="14" fill="#594563"><tspan x="700">reads each chapter directly</tspan><tspan x="700" dy="22">curates accepted-knowledge digest</tspan><tspan x="700" dy="22">dispatches two readers in parallel</tspan><tspan x="700" dy="22">reconciles 3 analyses, sole KB writer</tspan><tspan x="700" dy="22">runs batch validation</tspan></text>
