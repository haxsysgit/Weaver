    <text x="1165" y="484" text-anchor="middle" font-size="14" fill="#444444"><tspan x="1165">fresh-context subagent</tspan><tspan x="1165" dy="22">reads assigned chapter file only</tspan><tspan x="1165" dy="22">never sees reader A's conclusions</tspan></text>
  </g>
