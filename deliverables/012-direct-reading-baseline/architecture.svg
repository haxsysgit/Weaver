    <text x="235" y="764" text-anchor="middle" font-size="14" fill="#3a5a3a"><tspan x="235">fresh-context, never edits</tspan><tspan x="235" dy="22">entity continuity, thread tracking</tspan><tspan x="235" dy="22">graph vs source spot checks</tspan></text>
  </g>
  <g>
    <rect x="505" y="680" width="390" height="150" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
    <path d="M505 712 H895" stroke="#6c8ebf" />
