<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506071"/></marker>
    <style>
      .title{font-family:DejaVu Sans,sans-serif;font-size:27px;font-weight:bold;fill:#172033}.sub{font-family:DejaVu Sans,sans-serif;font-size:14px;fill:#526071}
      .head{font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold;fill:#172033}.small{font-family:DejaVu Sans,sans-serif;font-size:12px;fill:#526071}
      .white{fill:#fff}.line{fill:none;stroke:#506071;stroke-width:2;marker-end:url(#arrow)}
      .label{font-family:DejaVu Sans,sans-serif;font-size:11px;fill:#526071}.box{stroke-width:2;rx:12}
    </style>
  </defs>
  <rect width="1400" height="780" fill="#fbfcfe"/>
  <text x="50" y="57" class="title">Weaver Plan 002 · Trusted Shadow Slave Library</text>
  <text x="50" y="86" class="sub">The LLM chooses a bounded tool. Deterministic code owns fetching, validation, writes, and evidence.</text>

  <rect x="50" y="145" width="220" height="90" class="box" fill="#f3f5f7" stroke="#738091" stroke-dasharray="7 5"/>
  <text x="160" y="180" class="head" text-anchor="middle">Conversation loop</text><text x="160" y="207" class="small" text-anchor="middle">LangGraph may wrap this later</text>
  <rect x="330" y="135" width="250" height="110" class="box" fill="#e8f0ff" stroke="#4f73d9"/>
  <text x="455" y="177" class="head" text-anchor="middle">Custom Weaver agent</text><text x="455" y="205" class="small" text-anchor="middle">understands request · chooses tool</text>
  <rect x="650" y="125" width="265" height="130" class="box" fill="#eaf8f2" stroke="#2c9b70"/>
  <text x="782" y="164" class="head" text-anchor="middle">Explicit typed registry</text><text x="782" y="191" class="small" text-anchor="middle">five names · Pydantic schemas</text><text x="782" y="213" class="small" text-anchor="middle">metadata-only results · effect policy</text>
  <rect x="985" y="135" width="210" height="110" class="box" fill="#fff5db" stroke="#d79b28"/>
  <text x="1090" y="172" class="head" text-anchor="middle">Corpus service</text><text x="1090" y="199" class="small" text-anchor="middle">inspect · fetch · update</text><text x="1090" y="220" class="small" text-anchor="middle">packet · export</text>

  <path d="M270 190 H330" class="line" stroke-dasharray="7 5"/><text x="278" y="178" class="label">optional</text>
  <path d="M580 190 H650" class="line"/><text x="592" y="178" class="label">tool call</text>
  <path d="M915 190 H985" class="line"/><text x="920" y="178" class="label">validated</text>

  <rect x="80" y="350" width="250" height="115" class="box" fill="#f2eafe" stroke="#8056c7"/>
  <text x="205" y="390" class="head" text-anchor="middle">Fixed ShadowSlaveSpec</text><text x="205" y="417" class="small" text-anchor="middle">domain · URL · selectors</text><text x="205" y="439" class="small" text-anchor="middle">canonical paths</text>
  <rect x="385" y="350" width="230" height="115" class="box" fill="#f2eafe" stroke="#8056c7"/>
  <text x="500" y="390" class="head" text-anchor="middle">Firecrawl adapter</text><text x="500" y="417" class="small" text-anchor="middle">fresh raw HTML · timeout</text><text x="500" y="439" class="small" text-anchor="middle">zero retries · paced</text>
  <rect x="670" y="350" width="245" height="115" class="box" fill="#eaf8f2" stroke="#2c9b70"/>
  <text x="792" y="390" class="head" text-anchor="middle">Deterministic cleaner</text><text x="792" y="417" class="small" text-anchor="middle">Beautiful Soup + lxml</text><text x="792" y="439" class="small" text-anchor="middle">fixed selector · paragraph order</text>
  <rect x="970" y="350" width="250" height="115" class="box" fill="#fff0f0" stroke="#c84d5a"/>
  <text x="1095" y="390" class="head" text-anchor="middle">Strict validator</text><text x="1095" y="417" class="small" text-anchor="middle">status · final URL · identity</text><text x="1095" y="439" class="small" text-anchor="middle">title · length · markers</text>

  <path d="M1090 245 V300 H205 V350" class="line"/><text x="626" y="289" class="label">fixed rules</text>
  <path d="M330 408 H385" class="line"/><path d="M615 408 H670" class="line"/><path d="M915 408 H970" class="line"/>
  <text x="402" y="395" class="label">exact URL</text><text x="620" y="395" class="label">raw HTML</text><text x="918" y="395" class="label">bytes</text>

  <rect x="350" y="585" width="300" height="130" class="box" fill="#172033" stroke="#172033"/>
  <text x="500" y="625" class="head" fill="#ffffff" style="fill:#ffffff" text-anchor="middle">Private novel corpus</text><text x="500" y="653" class="small" fill="#ffffff" style="fill:#ffffff" text-anchor="middle">valid files immutable</text><text x="500" y="675" class="small" fill="#ffffff" style="fill:#ffffff" text-anchor="middle">append missing · replace proven invalid</text><text x="500" y="697" class="small" fill="#ffffff" style="fill:#ffffff" text-anchor="middle">directories 0700 · files 0600</text>
  <rect x="760" y="585" width="300" height="130" class="box" fill="#fff0f0" stroke="#c84d5a"/>
  <text x="910" y="625" class="head" text-anchor="middle">Ignored Weaver state</text><text x="910" y="653" class="small" text-anchor="middle">manifest · metadata receipts</text><text x="910" y="675" class="small" text-anchor="middle">packets · TXT/MD/EPUB exports</text>
  <path d="M1095 465 V530 H500 V585" class="line"/><text x="704" y="519" class="label">validated atomic write</text>
  <path d="M1090 245 V555 H910 V585" class="line"/><text x="990" y="545" class="label">hashes + statuses only</text>
  <path d="M650 650 H760" class="line"/><text x="659" y="637" class="label">ordered private inputs</text>
</svg>
